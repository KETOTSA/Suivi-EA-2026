let cache = {};

function padKey(n){ return String(n).padStart(2,"0"); }

function defaultStatus(){
  return {
    statutDenombrement: "en_cours",
    nbMenages: null,
    zoneLibre: "",
    dateFin: null,
    remarques: "",
    statutEnquete: "non_assigne",
    dateAssignation: null
  };
}

async function loadStatus(n){
  try{
    const snap = await getDoc(doc(db, "equipes", padKey(n)));
    if(snap.exists()) return Object.assign(defaultStatus(), snap.data());
  }catch(e){ console.error("loadStatus", e); }
  return defaultStatus();
}

async function saveStatus(n, data){
  await setDoc(doc(db, "equipes", padKey(n)), data);
  cache[n] = data;
}

async function loadAllStatuses(){
  const found = {};
  try{
    const snap = await getDocs(collection(db, "equipes"));
    snap.forEach(d => { found[d.id] = d.data(); });
  }catch(e){ console.error("loadAllStatuses", e); }
  TEAMS.forEach(t=>{
    const raw = found[padKey(t.n)];
    cache[t.n] = raw ? Object.assign(defaultStatus(), raw) : defaultStatus();
  });
  return cache;
}

/* ============ Login ============ */
function renderLogin(){
  session = null;
  render(`
    <div class="login-wrap">
      <h1>Suivi des equipes - Enquete ENSEA 2026</h1>
      <p>Connectez-vous avec votre identifiant pour signaler l'avancement de votre equipe, ou pour acceder a l'espace equipe IT.</p>
      <div class="panel">
        <label for="loginInput">Identifiant</label>
        <input id="loginInput" type="text" class="code" autocomplete="username" placeholder="EA2026_sup_11">
        <label for="pwInput">Mot de passe</label>
        <input id="pwInput" type="password" class="code" autocomplete="current-password">
        <div id="loginError" class="error" style="display:none;"></div>
        <div style="margin-top:18px;">
          <button class="btn" onclick="attemptLogin()">Se connecter</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById("pwInput").addEventListener("keydown", e=>{
    if(e.key === "Enter") attemptLogin();
  });
}

function attemptLogin(){
  const login = document.getElementById("loginInput").value.trim();
  const pw = document.getElementById("pwInput").value.trim();
  const err = document.getElementById("loginError");
  const entry = LOGIN_DB[login];
  if(!entry || entry.password !== pw){
    err.textContent = "Identifiant ou mot de passe incorrect.";
    err.style.display = "block";
    return;
  }
  session = { role: entry.role, team: entry.team || null };
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({ login: login, role: entry.role, team: entry.team || null }));
  }catch(e){ console.error("localStorage", e); }
  if(session.role === "chef") goTeamForm(session.team);
  else goIT();
}

function logout(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  renderLogin();
}

function initSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      const entry = LOGIN_DB[saved.login];
      if(entry && entry.role === saved.role){
        session = { role: entry.role, team: entry.team || null };
        if(session.role === "chef"){ goTeamForm(session.team); return; }
        goIT();
        return;
      }
    }
  }catch(e){ console.error("initSession", e); }
  renderLogin();
}

        <input id="dateFin" type="date" value="${data.dateFin || todayISO()}">

        <label for="remarques">Remarques (facultatif)</label>
        <textarea id="remarques" placeholder="Difficultes rencontrees, zones incompletes, etc.">${data.remarques || ''}</textarea>

        <div id="formError" class="error" style="display:none;"></div>
        <div style="margin-top:18px; display:flex; gap:10px;">
          <button class="btn auto" onclick="submitTeamForm(${n})">Envoyer a la coordination</button>
          ${forceForm ? `<button class="btn ghost" onclick="goTeamForm(${n})">Annuler</button>` : ``}
        </div>
      </div>
    </main>
  `);
}

async function submitTeamForm(n){
  const nbMenages = document.getElementById("nbMenages").value;
  const dateFin = document.getElementById("dateFin").value;
  const err = document.getElementById("formError");
  if(!nbMenages || !dateFin){
    err.textContent = "Merci de renseigner le nombre de menages et la date.";
    err.style.display = "block";
    return;
  }
  const submitBtn = document.querySelector(".btn.auto");
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Envoi..."; }

  const data = cache[n] || defaultStatus();
  data.zoneLibre = document.getElementById("zoneLibre").value.trim();
  data.nbMenages = parseInt(nbMenages,10);
  data.dateFin = dateFin;
  data.remarques = document.getElementById("remarques").value.trim();
  data.statutDenombrement = "termine";

  try{
    await saveStatus(n, data);
    await renderTeamDone(n, data);
  }catch(e){
    console.error(e);
    err.textContent = "Erreur d'envoi. Verifiez la connexion internet et reessayez.";
    err.style.display = "block";
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Envoyer a la coordination"; }
  }
}

  if(!isAssigned){

async function updateRuralCounts(n){
  const coll = collecteCache[n] || defaultCollecte();
  const nbEnq = Math.max(0, parseInt(document.getElementById("nbEnquetesInput").value)||0);
  coll.nbEnquetes = nbEnq;
  if(!coll.totalApprouve){
    const totalVal = document.getElementById("totalAffecteInput").value;
    coll.totalAffecte = totalVal === "" ? null : Math.max(0, parseInt(totalVal)||0);
  }
  collecteCache[n] = coll;
  renderCollecteChefRural(n, TEAM_BY_N[n], cache[n], coll);
  saveCollecte(n, coll).catch(e=>console.error("updateRuralCounts", e));

function renderCollecteChefBody(n, team, data, coll){
  const total = coll.menages.length;
  const complets = coll.menages.filter(menageComplet).length;
  const versQuota = Math.min(complets, QUOTA_URBAIN);
  const quotaAtteint = complets >= QUOTA_URBAIN;

  const visibles = coll.menages
    .map((m, idx)=>({m, idx}))
    .filter(({m}) => !chefSearch || menageId(m).toLowerCase().includes(chefSearch.toLowerCase()));

  const rows = visibles.map(({m, idx})=>{
    const cells = QUESTIONNAIRES.map(q=>`
      <td>
        <select class="qsel st-${m[q.key]}" onchange="toggleQ(${n}, ${idx}, '${q.key}', this.value); this.className='qsel st-'+this.value;">
          ${Q_STATUTS.map(s=>`<option value="${s.value}" ${m[q.key]===s.value?"selected":""}>${s.label}</option>`).join("")}
        </select>
      </td>
    `).join("");
    const statutPill = menageComplet(m) ? `<span class="pill termine">Complet</span>`
      : menageRejete(m) ? `<span class="pill rejete">A reprendre</span>`
      : `<span class="pill en_cours">En cours</span>`;
    return `
      <tr>
        <td class="code">${menageId(m)}</td>
        ${cells}
        <td>${statutPill}</td>
      </tr>
    `;
  }).join("");

  render(`
    ${topbar("Espace chef d'equipe", "Equipe " + n)}
    <main>
      <div class="team-id-card">
        <div>
          <div class="name">${team.nom}</div>
          <div class="meta">Equipe ${n} &middot; ${team.milieu === "RURAL" ? "Rural" : "Urbain"} &middot; ZD ${team.zd}</div>
        </div>
      </div>
      <div class="panel">
        <div class="info-msg">Enquete affectee le ${fmtDate(data.dateAssignation)}. Objectif : ${QUOTA_URBAIN} menages entierement enquetes (vous disposez de ${total} menages au total, dont une reserve de remplacement en cas de refus ou d'absence).</div>
      </div>
      <div class="stat-row" style="grid-template-columns:1fr 1fr;">
        <div class="stat"><div class="num">${versQuota}/${QUOTA_URBAIN}</div><div class="lbl">Progression vers le quota${quotaAtteint ? " - Quota atteint" : ""}</div></div>
        <div class="stat"><div class="num">${complets}/${total}</div><div class="lbl">Menages complets sur le total disponible</div></div>
      </div>
      ${total ? `
      <div class="toolbar">
        <input type="text" placeholder="Rechercher un menage (ID)..." style="max-width:320px;" value="${chefSearch}" oninput="setChefSearch(this.value)">
      </div>` : ``}
      <div class="panel" style="padding:0;">
        <div class="table-wrap">
        ${total ? `
        <table>
          <thead><tr>
            <th>ID menage</th>${QUESTIONNAIRES.map(q=>`<th>${q.label}</th>`).join("")}<th>Statut</th>
          </tr></thead>
          <tbody>${rows.length ? rows : `<tr><td colspan="6" class="empty">Aucun menage ne correspond a la recherche</td></tr>`}</tbody>
        </table>` : `<div class="empty">Aucun menage ne vous a encore ete affecte. Contactez l'equipe IT.</div>`}
        </div>
      </div>
    </main>
  `);
}

async function toggleQ(n, idx, field, value){
  const data = collecteCache[n] || (await loadCollecte(n));
  if(!data.menages[idx]) return;
  data.menages[idx][field] = value;
  await saveCollecte(n, data);
  collecteCache[n] = data;
}

function uniqueZDs(){
  const set = new Set(TEAMS.map(t=>t.zd));
  return Array.from(set).sort();
}

function renderDenombrementIT(){
  const all = TEAMS.map(t => Object.assign({}, t, cache[t.n] || defaultStatus()));
  const nbTermine = all.filter(t=>t.statutDenombrement==="termine").length;
  const nbAssigne = all.filter(t=>t.statutEnquete==="assigne").length;
  const nbAttente = nbTermine - nbAssigne;
  const nbEnCours = TOTAL_EQUIPES - nbTermine;

  let filtered = all;
  if(filters.statut==="en_cours") filtered = filtered.filter(t=>t.statutDenombrement==="en_cours");
  if(filters.statut==="attente") filtered = filtered.filter(t=>t.statutDenombrement==="termine" && t.statutEnquete!=="assigne");
  if(filters.statut==="assigne") filtered = filtered.filter(t=>t.statutEnquete==="assigne");
  if(filters.milieu!=="tous") filtered = filtered.filter(t=>t.milieu===filters.milieu);
  if(filters.zd!=="tous") filtered = filtered.filter(t=>t.zd===filters.zd);

  const zdOptions = uniqueZDs().map(z=>`<option value="${z}" ${filters.zd===z?"selected":""}>${z}</option>`).join("");

  const rows = filtered.map(t=>{
    const pillDenom = t.statutDenombrement==="termine"
      ? `<span class="pill termine">Termine</span>`
      : `<span class="pill en_cours">En cours</span>`;
    const pillEnquete = t.statutEnquete==="assigne"
      ? `<span class="pill assigne">Affecte</span>` : "-";
    const pillMilieu = t.milieu==="RURAL"
      ? `<span class="pill milieu-rural">Rural</span>`
      : `<span class="pill milieu-urbain">Urbain</span>`;
    let action;
    if(t.statutEnquete === "assigne"){
      action = `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
        <span class="hint">${fmtDate(t.dateAssignation)}</span>
        <button class="btn ghost small" onclick="unassignSurvey(${t.n})">Annuler l'affectation</button>
      </div>`;
    } else if(t.statutDenombrement === "termine"){
      action = `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
        <button class="btn amber" onclick="assignSurvey(${t.n})">Affecter</button>
        <button class="btn ghost small" onclick="resetTeam(${t.n})">Reinitialiser</button>
      </div>`;
    } else {
      action = `<span class="hint">-</span>`;
    }
    return `
      <tr>
        <td>${t.n}</td>
        <td>${t.nom}</td>
        <td>${pillMilieu}</td>
        <td class="code">${t.zd}</td>
        <td>${t.zoneLibre || "-"}</td>
        <td>${pillDenom}</td>
        <td>${t.nbMenages ?? "-"}</td>
        <td>${fmtDate(t.dateFin)}</td>
        <td>${pillEnquete}</td>
        <td class="row-actions">${action}</td>
      </tr>
    `;
  }).join("");

  render(`
    ${topbar("Equipe IT", "Suivi des 40 equipes - denombrement puis enquete")}
    <main>
      ${itTabBar()}
      <div class="stat-row">
        <div class="stat"><div class="num">${nbEnCours}</div><div class="lbl">En cours de denombrement</div></div>
        <div class="stat"><div class="num">${nbTermine}/${TOTAL_EQUIPES}</div><div class="lbl">Denombrement termine</div></div>
        <div class="stat"><div class="num">${nbAttente}</div><div class="lbl">En attente d'affectation</div></div>
        <div class="stat"><div class="num">${nbAssigne}</div><div class="lbl">Enquete affectee</div></div>
      </div>

      <div class="chips">
        <button class="${filters.statut==='tous'?'active':''}" onclick="setStatutFilter('tous')">Toutes</button>
        <button class="${filters.statut==='en_cours'?'active':''}" onclick="setStatutFilter('en_cours')">En cours</button>
        <button class="${filters.statut==='attente'?'active':''}" onclick="setStatutFilter('attente')">En attente d'affectation</button>
        <button class="${filters.statut==='assigne'?'active':''}" onclick="setStatutFilter('assigne')">Enquete affectee</button>
      </div>

      <div class="filters-row">
        <div class="fgroup">
          <label for="milieuFilter">Milieu</label>
          <select id="milieuFilter" onchange="setMilieuFilter(this.value)">
            <option value="tous" ${filters.milieu==='tous'?'selected':''}>Tous</option>
            <option value="RURAL" ${filters.milieu==='RURAL'?'selected':''}>Rural</option>
            <option value="URBAIN" ${filters.milieu==='URBAIN'?'selected':''}>Urbain</option>

function exportCollecteExcel(){
  const resume = TEAMS.map(t=>{
    const coll = collecteCache[t.n] || defaultCollecte();
    if(t.milieu === "RURAL"){
      const total = coll.totalAffecte || 0;
      const complets = coll.nbEnquetes || 0;
      return {
        Equipe: t.n, Chef: t.nom, Milieu: t.milieu, ZD: t.zd,
        Menages_affectes: total, Quota_cible: total, Complets: complets, Rejetes: "",
        Pourcentage_vs_quota: total ? Math.round(100*Math.min(complets,total)/total)+"%" : "",
        Total_valide_IT: coll.totalApprouve ? "Oui" : "Non"
      };
    }
    const total = coll.menages.length;
    const complets = coll.menages.filter(menageComplet).length;
    const rejetes = coll.menages.filter(menageRejete).length;
    return {
      Equipe: t.n, Chef: t.nom, Milieu: t.milieu, ZD: t.zd,
      Menages_affectes: total, Quota_cible: QUOTA_URBAIN, Complets: complets, Rejetes: rejetes,
      Pourcentage_vs_quota: Math.round(100*Math.min(complets,QUOTA_URBAIN)/QUOTA_URBAIN)+"%",
      Total_valide_IT: ""
    };
  });

  const menagesUrbains = [];
  TEAMS.filter(t=>t.milieu==="URBAIN").forEach(t=>{
    const coll = collecteCache[t.n] || defaultCollecte();
    coll.menages.forEach(m=>{
      menagesUrbains.push({
        Equipe: t.n,
        ID_menage: menageId(m),
        Menage: qStatusLabel(m.q_menage),
        Senior: qStatusLabel(m.q_senior),
        Travail_enfants: qStatusLabel(m.q_enfants),
        Education: qStatusLabel(m.q_education),
        Statut: menageComplet(m) ? "Complet" : (menageRejete(m) ? "A reprendre" : "En cours")
      });
    });
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resume), "Resume equipes");
  if(menagesUrbains.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(menagesUrbains), "Menages urbains");
  XLSX.writeFile(wb, "suivi_collecte_" + todayISO() + ".xlsx");
}

function renderCollecteIT(){
  if(itTeamDetail){ renderTeamDetailIT(itTeamDetail); return; }

  let teamRows = TEAMS.map(t=>{
    const coll = collecteCache[t.n] || defaultCollecte();
    if(t.milieu === "RURAL"){
      const total = coll.totalAffecte || 0;
      const complets = coll.nbEnquetes || 0;
      const cible = total;
      const pct = cible ? Math.round(100*Math.min(complets,cible)/cible) : 0;
      return { t, coll, total, complets, rejetes: 0, cible, pct };
    }
    const total = coll.menages.length;
    const complets = coll.menages.filter(menageComplet).length;
    const rejetes = coll.menages.filter(menageRejete).length;
    const cible = QUOTA_URBAIN;
    const pct = Math.round(100*Math.min(complets,cible)/cible);
    return { t, coll, total, complets, rejetes, cible, pct };
  });
  if(itMilieuFilter !== "tous") teamRows = teamRows.filter(r => r.t.milieu === itMilieuFilter);
  if(itSearch){
    const q = itSearch.toLowerCase();
    teamRows = teamRows.filter(r => r.t.nom.toLowerCase().includes(q) || String(r.t.n).includes(q));
  }

  const totalCible = teamRows.reduce((s,r)=>s+r.cible,0);
  const totalComplets = teamRows.reduce((s,r)=>s+Math.min(r.complets,r.cible),0);
  const totalRejetes = teamRows.reduce((s,r)=>s+r.rejetes,0);

  if(itSortMode === "classement"){
    teamRows = teamRows.slice().sort((a,b) => b.complets - a.complets || b.pct - a.pct || a.t.n - b.t.n);
  }

  const trs = teamRows.map(({t,coll,total,complets,rejetes,cible,pct}, idx)=>{
    const rankCell = itSortMode === "classement" ? `<td><strong>#${idx+1}</strong></td>` : `<td>${t.n}</td>`;
    if(t.milieu === "RURAL"){
      const locked = !!coll.totalApprouve;
      const hasProposal = coll.totalAffecte !== null && coll.totalAffecte !== undefined;
      const totalCell = locked
        ? `<span class="code">${coll.totalAffecte}</span> <span class="pill termine" style="margin-left:4px;">Valide</span>`
        : `<input type="number" min="0" value="${coll.totalAffecte ?? ''}" placeholder="-" style="width:80px;padding:5px 7px;" onchange="updateTotalAffecteIT(${t.n}, this.value)">`;
      const actionCell = locked
        ? `<button class="btn ghost small" onclick="unapproveTotalAffecte(${t.n})">Deverrouiller</button>`
        : `<button class="btn ghost small" onclick="approveTotalAffecte(${t.n})" ${hasProposal?"":"disabled"}>Valider le total</button>`;
      return `
        <tr>
          ${rankCell}
          <td>${t.nom}</td>
          <td class="code">${t.zd}</td>
          <td>${totalCell}</td>
          <td class="hint">${cible || "-"}</td>
          <td>${complets}</td>
          <td>-</td>
          <td>${cible ? pct+"%" : "-"}</td>
          <td class="row-actions">
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
              <button class="btn ghost small" onclick="openTeamDetailIT(${t.n})">Detail</button>
              ${actionCell}
            </div>
          </td>
        </tr>
      `;
    }
    return `
      <tr>
        ${rankCell}
        <td>${t.nom}</td>
        <td class="code">${t.zd}</td>
        <td>${total}</td>
        <td class="hint">${cible}</td>
        <td>${complets}${complets>cible ? ` <span class="hint">(dont remplacement)</span>` : ""}</td>
        <td>${rejetes ? `<span class="pill rejete">${rejetes}</span>` : "0"}</td>
        <td>${pct}%</td>
        <td class="row-actions">
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
            <button class="btn ghost small" onclick="openTeamDetailIT(${t.n})">Detail</button>
            <button class="btn ghost small" onclick="openAddMenageModal(${t.n})">+ Menage</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");

  render(`
    ${topbar("Equipe IT", "Suivi de la collecte")}
    <main>
      ${itTabBar()}
      ${flashBanner()}
      <div class="stat-row">
        <div class="stat"><div class="num">${totalCible}</div><div class="lbl">Objectif total (quota 30/equipe urbaine + totaux ruraux valides)</div></div>
        <div class="stat"><div class="num">${totalComplets}</div><div class="lbl">Menages entierement enquetes (dans la limite du quota)</div></div>
        <div class="stat"><div class="num">${totalRejetes}</div><div class="lbl">Questionnaires rejetes</div></div>
        <div class="stat"><div class="num">${totalCible ? Math.round(100*totalComplets/totalCible) : 0}%</div><div class="lbl">Avancement global vs quota</div></div>
      </div>

      <div class="filters-row">
        <div class="fgroup">
          <label for="itMilieuSelect">Milieu</label>
          <select id="itMilieuSelect" onchange="setITMilieuFilter(this.value)">
            <option value="tous" ${itMilieuFilter==='tous'?'selected':''}>Tous</option>
            <option value="RURAL" ${itMilieuFilter==='RURAL'?'selected':''}>Rural</option>
            <option value="URBAIN" ${itMilieuFilter==='URBAIN'?'selected':''}>Urbain</option>
          </select>
        </div>
        <div class="fgroup">
          <label for="itSortSelect">Trier par</label>
          <select id="itSortSelect" onchange="setITSortMode(this.value)">
            <option value="numero" ${itSortMode==='numero'?'selected':''}>Numero d'equipe</option>
            <option value="classement" ${itSortMode==='classement'?'selected':''}>Classement (menages enquetes)</option>
          </select>
        </div>
        <div class="fgroup" style="flex:1; min-width:220px;">
          <label for="itSearchInput">Rechercher une equipe</label>
          <input id="itSearchInput" type="text" placeholder="Nom ou numero..." value="${itSearch}" oninput="setITSearch(this.value)">
        </div>
        <div class="fgroup">
          <button class="btn amber auto" onclick="openImportMenages()">Importer des menages (CSV / Excel)</button>
        </div>
        <div class="fgroup">
          <button class="btn ghost" onclick="exportCollecteExcel()">Exporter (Excel)</button>
        </div>
      </div>
      <p class="hint" style="margin-bottom:16px;">Equipes urbaines : colonnes Equipe, ZD, Ilot, Lot, Numero de menage. Equipes rurales : le chef propose un total, vous le validez ici (une fois valide, seule l'equipe IT peut le modifier).</p>

      <div class="panel" style="padding:0;">
        <div class="table-wrap">
        <table>
          <thead><tr>
            <th>${itSortMode === 'classement' ? 'Rang' : 'Eq.'}</th><th>Chef d'equipe</th><th>ZD</th><th>Affectes</th><th>Quota</th><th>Complets</th><th>Rejetes</th><th>%</th><th></th>
          </tr></thead>
          <tbody>${trs.length ? trs : `<tr><td colspan="9" class="empty">Aucune equipe ne correspond aux filtres</td></tr>`}</tbody>
        </table>
        </div>
      </div>
    </main>
    ${menagesModal ? renderMenagesModal() : ""}
  `);
}

}

async function updateRuralCountsIT(n){
  const coll = collecteCache[n] || defaultCollecte();
  const totalVal = document.getElementById("itTotalAffecteInput").value;
  coll.totalAffecte = totalVal === "" ? null : Math.max(0, parseInt(totalVal)||0);
  coll.nbEnquetes = Math.max(0, parseInt(document.getElementById("itNbEnquetesInput").value)||0);
  await saveCollecte(n, coll);
  logAction(`Chiffres ruraux mis a jour par l'IT pour l'equipe ${n} (denombres: ${coll.totalAffecte}, enquetes: ${coll.nbEnquetes})`, n);
  renderTeamDetailITRural(n, TEAM_BY_N[n], coll);
}

function renderTeamDetailIT(n){
  const team = TEAM_BY_N[n];
  const coll = collecteCache[n] || defaultCollecte();

  if(team.milieu === "RURAL"){
    renderTeamDetailITRural(n, team, coll);
    return;
  }

  const total = coll.menages.length;
  const complets = coll.menages.filter(menageComplet).length;

  const visibles = coll.menages
    .map((m, idx)=>({m, idx}))
    .filter(({m}) => !itDetailSearch || menageId(m).toLowerCase().includes(itDetailSearch.toLowerCase()));
  const visibleIdxs = visibles.map(v=>v.idx);
  const allVisibleSelected = visibleIdxs.length>0 && visibleIdxs.every(i=>selectedMenages.has(i));
  const nbSelected = [...selectedMenages].filter(i=>visibleIdxs.includes(i)).length;

  const rows = visibles.map(({m, idx})=>{
    const cells = QUESTIONNAIRES.map(q=>`
      <td>
        <select class="qsel st-${m[q.key]}" onchange="toggleQ(${n}, ${idx}, '${q.key}', this.value); this.className='qsel st-'+this.value;">
          ${Q_STATUTS.map(s=>`<option value="${s.value}" ${m[q.key]===s.value?"selected":""}>${s.label}</option>`).join("")}
        </select>
      </td>
    `).join("");
    const statutPill = menageComplet(m) ? `<span class="pill termine">Complet</span>`
      : menageRejete(m) ? `<span class="pill rejete">A reprendre</span>`
      : `<span class="pill en_cours">En cours</span>`;
    return `
      <tr>
        <td><input type="checkbox" ${selectedMenages.has(idx)?"checked":""} onchange="toggleSelectMenage(${idx}, this.checked)"></td>
        <td class="code">${menageId(m)}</td>
        ${cells}
        <td>${statutPill}</td>
        <td class="row-actions">
          <div style="display:flex;gap:6px;">
            <button class="btn ghost small" onclick="openEditMenageModal(${n}, ${idx})">Modifier</button>
            <button class="btn danger small" onclick="deleteMenage(${n}, ${idx})">Suppr.</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");

  render(`
    ${topbar("Equipe IT", "Detail collecte - Equipe " + n)}
    <main>
      <button class="btn ghost" style="margin-bottom:16px;" onclick="closeTeamDetailIT()">&larr; Retour au suivi collecte</button>
      ${flashBanner()}
      <div class="team-id-card">
        <div>
          <div class="name">${team.nom}</div>
          <div class="meta">Equipe ${n} &middot; ${team.milieu === "RURAL" ? "Rural" : "Urbain"} &middot; ZD ${team.zd}</div>
        </div>
        <button class="btn amber auto" onclick="openAddMenageModal(${n})">+ Ajouter un menage</button>
      </div>
      <div class="stat-row" style="grid-template-columns:1fr;">
        <div class="stat"><div class="num">${complets}/${total}</div><div class="lbl">Menages entierement enquetes</div></div>
      </div>
      ${total ? `
      <div class="toolbar">
        <input type="text" placeholder="Rechercher un menage (ID)..." style="max-width:320px;" value="${itDetailSearch}" oninput="setITDetailSearch(this.value)">
        ${nbSelected ? `<button class="btn danger auto" onclick="deleteSelectedMenages(${n})">Supprimer la selection (${nbSelected})</button>` : ``}
      </div>` : ``}
      <div class="panel" style="padding:0;">
        <div class="table-wrap">
        ${total ? `
        <table>
          <thead><tr>
            <th><input type="checkbox" ${allVisibleSelected?"checked":""} onchange="toggleSelectAllMenages(this.checked, [${visibleIdxs.join(",")}])"></th>
            <th>ID menage</th>${QUESTIONNAIRES.map(q=>`<th>${q.label}</th>`).join("")}<th>Statut</th><th></th>
          </tr></thead>
          <tbody>${rows.length ? rows : `<tr><td colspan="8" class="empty">Aucun menage ne correspond a la recherche</td></tr>`}</tbody>
        </table>` : `<div class="empty">Aucun menage affecte a cette equipe pour le moment.</div>`}
        </div>
      </div>
    </main>
    ${menagesModal ? renderMenagesModal() : ""}
  `);
}

async function deleteMenage(n, idx){
  if(!confirm("Supprimer ce menage de la liste de l'equipe " + n + " ? Cette action est irreversible.")) return;
  const coll = collecteCache[n] || defaultCollecte();
  coll.menages.splice(idx, 1);
  selectedMenages = new Set([...selectedMenages].filter(i=>i!==idx).map(i=>i>idx?i-1:i));
  await saveCollecte(n, coll);
  logAction(`1 menage supprime pour l'equipe ${n}`, n);
  renderTeamDetailIT(n);
}

async function deleteSelectedMenages(n){
  const idxs = [...selectedMenages].sort((a,b)=>b-a);
  if(!idxs.length) return;
  if(!confirm(`Supprimer les ${idxs.length} menage(s) selectionne(s) de l'equipe ${n} ? Cette action est irreversible.`)) return;
  const coll = collecteCache[n] || defaultCollecte();
  idxs.forEach(i => coll.menages.splice(i, 1));
  selectedMenages = new Set();
  await saveCollecte(n, coll);
  logAction(`${idxs.length} menage(s) supprime(s) pour l'equipe ${n}`, n);
  setFlash(`${idxs.length} menage(s) supprime(s).`, "success");
  renderTeamDetailIT(n);
}

/* ============ Modales : ajout / edition / import de menages ============ */
function openImportMenages(){ menagesModal = { step: "upload" }; (itTeamDetail ? renderTeamDetailIT(itTeamDetail) : renderCollecteIT()); }
function openAddMenageModal(n){ menagesModal = { step: "addMenage", team: n }; (itTeamDetail ? renderTeamDetailIT(itTeamDetail) : renderCollecteIT()); }

function closeMenagesModal(){ menagesModal = null; (itTeamDetail ? renderTeamDetailIT(itTeamDetail) : renderCollecteIT()); }
function closeMenagesModalOnOverlay(e){ if(e.target.classList.contains("overlay")) closeMenagesModal(); }

function renderMenagesModal(){
  if(menagesModal.step === "addMenage" || menagesModal.step === "editMenage"){
    const t = TEAM_BY_N[menagesModal.team];
    const isEdit = menagesModal.step === "editMenage";

        <div class="panel" style="width:380px;max-width:90vw;">
          <h3 style="font-size:1.05rem;margin-bottom:14px;">${isEdit ? "Modifier le menage" : "Ajouter un menage"} - Equipe ${t.n}</h3>
          <label>ZD</label>
          <input id="mm-zd" type="text" value="${existing.zd||''}">
          <label>Ilot</label>
          <input id="mm-ilot" type="text" placeholder="ex. 02" value="${existing.ilot||''}">
          <label>Lot</label>
          <input id="mm-lot" type="text" placeholder="ex. 01" value="${existing.lot||''}">
          <label>Numero de menage</label>
          <input id="mm-numero" type="text" placeholder="ex. 015" value="${existing.numero||''}">
          <div style="margin-top:18px; display:flex; gap:10px;">
            <button class="btn auto" onclick="${isEdit ? `submitEditMenage(${t.n}, ${menagesModal.idx})` : `submitAddMenage(${t.n})`}">${isEdit ? "Enregistrer" : "Ajouter"}</button>

          </div>
        </div>
      </div>
    `;
  }
  if(menagesModal.step === "upload"){
    return `
      <div class="overlay" onclick="closeMenagesModalOnOverlay(event)">
        <div class="panel" style="width:420px;max-width:90vw;">
          <h3 style="font-size:1.05rem;margin-bottom:14px;">Importer des menages</h3>
          <div class="hint" style="margin-bottom:10px;">Fichier CSV ou Excel avec les colonnes Equipe, ZD, Ilot, Lot, Numero de menage.</div>
          <input id="mm-file" type="file" accept=".csv,.xlsx,.xls" onchange="onMenagesFileChosen(this.files[0])">
          <div style="margin-top:18px;">
            <button class="btn ghost" onclick="closeMenagesModal()">Annuler</button>
          </div>
        </div>
      </div>
    `;
  }
  if(menagesModal.step === "mapping"){
    const headers = menagesModal.headers;
    const opt = (sel) => `<option value="-1" ${sel===-1?"selected":""}>- Aucune -</option>` +
      headers.map((h,i)=>`<option value="${i}" ${sel===i?"selected":""}>${h}</option>`).join("");
    return `
      <div class="overlay" onclick="closeMenagesModalOnOverlay(event)">
        <div class="panel" style="width:420px;max-width:90vw;">
          <h3 style="font-size:1.05rem;margin-bottom:14px;">Faire correspondre les colonnes</h3>
          <label>Equipe (numero)</label>
          <select id="mm-col-equipe">${opt(menagesModal.equipeCol)}</select>
          <label>ZD</label>
          <select id="mm-col-zd">${opt(menagesModal.zdCol)}</select>
          <label>Ilot</label>
          <select id="mm-col-ilot">${opt(menagesModal.ilotCol)}</select>
          <label>Lot</label>
          <select id="mm-col-lot">${opt(menagesModal.lotCol)}</select>
          <label>Numero de menage</label>
          <select id="mm-col-numero">${opt(menagesModal.numCol)}</select>
          <div class="hint" style="margin-top:10px;">${menagesModal.dataRows.length} ligne(s) detectee(s).</div>
          <div id="mm-import-error" class="error" style="display:none;"></div>
          <div style="margin-top:18px; display:flex; gap:10px;">
            <button id="mm-import-btn" class="btn auto" onclick="submitImportMenages()">Importer</button>
            <button class="btn ghost" onclick="closeMenagesModal()">Annuler</button>
          </div>
        </div>
      </div>
    `;
  }
  return "";
}

function guessMenageCol(headers, keywords, excludeKeywords){
  const idx = headers.findIndex(h => {
    const hl = String(h).toLowerCase();
    if(excludeKeywords && excludeKeywords.some(k => hl.includes(k))) return false;
    return keywords.some(k => hl.includes(k));
  });
  return idx >= 0 ? idx : -1;
}

function onMenagesFileChosen(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:"binary"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
      if(rows.length < 2){ alert("Fichier vide ou illisible"); return; }
      const headers = rows[0].map(h=>String(h));
      const dataRows = rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==""));
      menagesModal = {
        step: "mapping",
        headers, dataRows,
        equipeCol: guessMenageCol(headers, ["equipe","équipe","team","chef","superviseur"]),
        zdCol: guessMenageCol(headers, ["zd","zone"]),
        ilotCol: guessMenageCol(headers, ["ilot","ilôt"]),
        lotCol: guessMenageCol(headers, ["lot","concession"], ["ilot","ilôt"]),
        numCol: guessMenageCol(headers, ["numero","numéro","menage","ménage","n°"])
      };
      (itTeamDetail ? renderTeamDetailIT(itTeamDetail) : renderCollecteIT());
    }catch(err){ alert("Impossible de lire ce fichier."); }
  };
  reader.readAsBinaryString(file);
}

async function submitImportMenages(){
  const btn = document.getElementById("mm-import-btn");
  const errBox = document.getElementById("mm-import-error");
  if(errBox){ errBox.style.display = "none"; }

  const equipeCol = parseInt(document.getElementById("mm-col-equipe").value);
  const zdCol = parseInt(document.getElementById("mm-col-zd").value);
  const ilotCol = parseInt(document.getElementById("mm-col-ilot").value);
  const lotCol = parseInt(document.getElementById("mm-col-lot").value);
  const numCol = parseInt(document.getElementById("mm-col-numero").value);
  if(equipeCol < 0 || numCol < 0){
    if(errBox){ errBox.textContent = "La colonne Equipe et la colonne Numero de menage sont obligatoires."; errBox.style.display = "block"; }
    return;
  }
  if(ilotCol>=0 && ilotCol===lotCol){
    if(errBox){ errBox.textContent = "Les colonnes Ilot et Lot pointent vers la meme colonne du fichier. Corrigez l'une des deux avant d'importer."; errBox.style.display = "block"; }
    return;
  }

  if(btn){ btn.disabled = true; btn.textContent = "Import en cours..."; }

  try{
    const byTeam = {};
    let added = 0, skipped = 0;
    menagesModal.dataRows.forEach(row=>{
      const teamN = parseInt(String(row[equipeCol]||"").trim(), 10);
      if(!teamN || !TEAM_BY_N[teamN]) { skipped++; return; }
      const zd = zdCol>=0 ? String(row[zdCol]||"").trim() : TEAM_BY_N[teamN].zd;
      const ilot = ilotCol>=0 ? String(row[ilotCol]||"").trim() : "";
      const lot = lotCol>=0 ? String(row[lotCol]||"").trim() : "";
      const numero = String(row[numCol]||"").trim();
      if(!numero){ skipped++; return; }
      if(!byTeam[teamN]) byTeam[teamN] = [];
      byTeam[teamN].push(Object.assign({zd, ilot, lot, numero}, defaultMenageQ()));
    });

    const teamNums = Object.keys(byTeam).map(Number);
    for(const teamN of teamNums){
      const coll = collecteCache[teamN] || defaultCollecte();
      const existingIds = new Set(coll.menages.map(menageId));
      byTeam[teamN].forEach(m=>{
        const id = menageId(m);
        if(existingIds.has(id)){ skipped++; return; }
        coll.menages.push(m);
        existingIds.add(id);
        added++;
      });
      await saveCollecte(teamN, coll);
    }

    menagesModal = null;
    setFlash(`${added} menage(s) importe(s)${skipped ? ", " + skipped + " ignore(s) (equipe invalide, doublon ou ligne incomplete)" : ""}.`, added > 0 ? "success" : "error");
    if(added>0) logAction(`Import : ${added} menage(s) ajoute(s) (${teamNums.join(", ")})`);
    (itTeamDetail ? renderTeamDetailIT(itTeamDetail) : renderCollecteIT());
  }catch(e){
    console.error("submitImportMenages", e);
    if(btn){ btn.disabled = false; btn.textContent = "Importer"; }
    if(errBox){ errBox.textContent = "Echec de l'import : " + (e && e.message ? e.message : "erreur inconnue") + ". Verifiez la connexion internet et reessayez."; errBox.style.display = "block"; }
  }
}

async function submitAddMenage(n){
  const zd = document.getElementById("mm-zd").value.trim();
  const ilot = document.getElementById("mm-ilot").value.trim();
  const lot = document.getElementById("mm-lot").value.trim();
  const numero = document.getElementById("mm-numero").value.trim();
  if(!numero){ alert("Le numero de menage est requis."); return; }
  const coll = collecteCache[n] || defaultCollecte();
  const m = Object.assign({zd, ilot, lot, numero}, defaultMenageQ());
  if(coll.menages.some(x=>menageId(x)===menageId(m))){ alert("Ce menage existe deja pour cette equipe."); return; }
  coll.menages.push(m);
  await saveCollecte(n, coll);
  menagesModal = null;
  (itTeamDetail ? renderTeamDetailIT(itTeamDetail) : renderCollecteIT());
}

async function submitEditMenage(n, idx){
  const zd = document.getElementById("mm-zd").value.trim();
  const ilot = document.getElementById("mm-ilot").value.trim();
  const lot = document.getElementById("mm-lot").value.trim();
  const numero = document.getElementById("mm-numero").value.trim();
  if(!numero){ alert("Le numero de menage est requis."); return; }
  const coll = collecteCache[n] || defaultCollecte();
  const current = coll.menages[idx];
  if(!current) { menagesModal = null; renderTeamDetailIT(n); return; }
  const updated = Object.assign({}, current, {zd, ilot, lot, numero});
  const newId = menageId(updated);
  if(coll.menages.some((x,i)=> i!==idx && menageId(x)===newId)){ alert("Un autre menage a deja cet identifiant."); return; }
  coll.menages[idx] = updated;
  await saveCollecte(n, coll);
  menagesModal = null;
  renderTeamDetailIT(n);
}
